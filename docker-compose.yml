# docker compose up --build
# Prerequisites (once): make sources ingest  → snapshot in data/snapshots, then: make index-docker
services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      # CPU profile: fewer, shorter cross-encoder pairs (the GPU benchmark uses 20 / 10 / 1024)
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-8}
      INELIGIBLE_RERANK_CANDIDATES: ${INELIGIBLE_RERANK_CANDIDATES:-4}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
      HF_OFFLINE: ${HF_OFFLINE:-true}
      WARMUP: "true"
    volumes:
      - ./data/snapshots:/app/data/snapshots:ro
      - ./data/indexes:/app/data/indexes
      - ./data/runtime:/app/data/runtime
      - ./data/pilot:/app/data/pilot:ro
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  qdrant_data:
